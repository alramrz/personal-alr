<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Diagnóstico 360</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: una sola "mesa de trabajo" centrada (máx. 1120px) bajo una barra fija; el cuestionario es una tarjeta por pantalla,
   con tipografía grande para que se lea al compartir pantalla en Zoom / Teams / Meet. El logotipo son 6 segmentos = 6 áreas evaluadas. */
:root {
  --bg: #edf1f0;
  --surface: #ffffff;
  --surface-2: #f5f8f7;
  --ink: #0f1f22;
  --ink-2: #44585b;
  --muted: #6b7e80;
  --line: #d8e0de;
  --line-2: #c3cfcc;
  --accent: #0b6b5c;
  --accent-hover: #08594c;
  --accent-ink: #ffffff;
  --accent-soft: #dff0ea;
  --accent-strong: #06473d;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --good-ink: #006300; --warn-ink: #7a5200; --serious-ink: #9c4520; --crit-ink: #b02a2a;
  --good-bg: #e6f5e6; --warn-bg: #fdf3dc; --serious-bg: #fcebe3; --crit-bg: #fbe6e6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --grid: #e3e8e6; --axis: #b9c4c2;
  --shadow: 0 1px 2px rgba(15,31,34,.06), 0 10px 28px -14px rgba(15,31,34,.22);
  --reco-bg: #06473d;
  --f-display: 'Bricolage Grotesque', 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --r-sm: 8px; --r-md: 14px; --r-lg: 22px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #091315; --surface: #0f1c1f; --surface-2: #132428; --ink: #e5eeec; --ink-2: #a6b8b6; --muted: #7d9291;
    --line: #1f3135; --line-2: #2c4146; --accent: #35b39a; --accent-hover: #4cc6ad; --accent-ink: #03211b;
    --accent-soft: #11312b; --accent-strong: #86dcc9;
    --good-ink: #3fcf3f; --warn-ink: #f6c453; --serious-ink: #f2a483; --crit-ink: #ff8585;
    --good-bg: #0f2a12; --warn-bg: #2d2410; --serious-bg: #2f1c14; --crit-bg: #321617;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --grid: #1c2d31; --axis: #35494d;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.7);
    --reco-bg: #0e3d35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #091315; --surface: #0f1c1f; --surface-2: #132428; --ink: #e5eeec; --ink-2: #a6b8b6; --muted: #7d9291;
  --line: #1f3135; --line-2: #2c4146; --accent: #35b39a; --accent-hover: #4cc6ad; --accent-ink: #03211b;
  --accent-soft: #11312b; --accent-strong: #86dcc9;
  --good-ink: #3fcf3f; --warn-ink: #f6c453; --serious-ink: #f2a483; --crit-ink: #ff8585;
  --good-bg: #0f2a12; --warn-bg: #2d2410; --serious-bg: #2f1c14; --crit-bg: #321617;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --grid: #1c2d31; --axis: #35494d;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.7);
  --reco-bg: #0e3d35;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 650; letter-spacing: -0.015em; line-height: 1.12; margin: 0; text-wrap: balance; color: var(--ink); }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-mono); font-size: 12.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- barra superior ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1120px; margin: 0 auto; padding-block: 12px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: flex; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; white-space: nowrap; background: none; border: 0; padding: 0; cursor: pointer; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand small { font-family: var(--f-mono); font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: .06em; margin-left: 2px; }
.stepper { flex: 1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; min-width: 0; }
.step { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.step-bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.step-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s ease; }
.step span { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.on span { color: var(--ink); }
.top-meta { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.timer { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.spacer { flex: 1; }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 16px; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; text-decoration: none; }
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-lg { min-height: 56px; padding: 0 28px; font-size: 17px; }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn-link { background: none; border: 0; padding: 6px 4px; color: var(--ink-2); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.btn-link:hover { color: var(--ink); text-decoration-color: currentColor; }
.btn svg { width: 18px; height: 18px; }
kbd { font-family: var(--f-mono); font-size: 11.5px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink-2); }

/* ---------- contenedor ---------- */
.page { max-width: 1120px; margin: 0 auto; padding-block: 40px 64px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.narrow { max-width: 760px; margin: 0 auto; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.enter { animation: enter .45s cubic-bezier(.2,.7,.2,1) both; }
@keyframes enter { from { opacity: .001; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.slide { animation: slide .38s cubic-bezier(.2,.7,.2,1) both; }
.slide.back { animation-name: slideback; }
@keyframes slide { from { opacity: .001; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes slideback { from { opacity: .001; transform: translateX(-28px); } to { opacity: 1; transform: none; } }

/* ---------- bienvenida ---------- */
.hero { display: grid; grid-template-columns: 1.08fr .92fr; gap: 56px; align-items: center; padding-top: 24px; }
.hero > * { min-width: 0; }
.hero h1 { font-size: clamp(38px, 5.4vw, 64px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.02; margin-top: 14px; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lead { font-size: 19px; color: var(--ink-2); margin-top: 20px; max-width: 34em; }
.facts { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 28px; }
.fact { display: flex; flex-direction: column; }
.fact b { font-family: var(--f-display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.fact span { font-size: 14px; color: var(--muted); }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; align-items: center; }
.cta-note { font-size: 14px; color: var(--muted); margin-top: 16px; }
.resume { margin-top: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border: 1px dashed var(--line-2); border-radius: var(--r-md); font-size: 15px; color: var(--ink-2); }

.sample { padding: 26px; position: relative; }
.sample-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 16px; }
.sample-head h3 { font-size: 20px; }
.tag { font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.sample-foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
.sample-foot b { color: var(--ink); }

/* ---------- barras de área (compartidas: ejemplo y resultados) ---------- */
.bars { display: flex; flex-direction: column; gap: 4px; }
.bar-row { display: grid; grid-template-columns: minmax(120px, 170px) 1fr 150px; gap: 14px; align-items: center; padding: 7px 8px; margin: 0 -8px; border-radius: 10px; background: none; border: 0; text-align: left; width: calc(100% + 16px); cursor: default; }
button.bar-row { cursor: pointer; }
button.bar-row:hover, button.bar-row[aria-expanded="true"] { background: var(--surface-2); }
.bar-name { font-weight: 600; font-size: 15px; min-width: 0; }
.bar-track { position: relative; height: 14px; border-radius: 4px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.bar-track .tick { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1px dashed var(--axis); }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; transform-origin: left; animation: grow .9s cubic-bezier(.2,.7,.2,1) both; }
@keyframes grow { from { transform: scaleX(.02); } to { transform: none; } }
.bar-fill.crit { background: var(--crit); } .bar-fill.serious { background: var(--serious); } .bar-fill.warn { background: var(--warn); } .bar-fill.good { background: var(--good); }
.bar-val { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.bar-val b { font-family: var(--f-mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: right; }
.bar-how { grid-column: 1 / -1; font-size: 14px; color: var(--ink-2); padding: 4px 0 6px; line-height: 1.5; }
.bar-how b { color: var(--ink); }
.scale { display: grid; grid-template-columns: minmax(120px, 170px) 1fr 150px; gap: 14px; margin-top: 6px; }
.scale-axis { position: relative; height: 18px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.scale-axis span { position: absolute; transform: translateX(-50%); }
.scale-axis span:first-child { transform: none; } .scale-axis span:last-child { transform: translateX(-100%); }

.bars.compact .bar-row, .scale.compact { grid-template-columns: minmax(110px, 150px) 1fr 36px; }
.bars.compact .bar-row > * { grid-column: auto; }
.scale.compact > :first-child { display: block; }

/* ---------- chips de estado ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; padding: 3px 9px 3px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.3; }
.chip svg { width: 13px; height: 13px; flex: none; }
.chip.crit { background: var(--crit-bg); color: var(--crit-ink); }
.chip.serious { background: var(--serious-bg); color: var(--serious-ink); }
.chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
.chip.good { background: var(--good-bg); color: var(--good-ink); }
.chip.neutral { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }

/* ---------- formularios ---------- */
.form-shell { display: grid; grid-template-columns: .85fr 1.15fr; gap: 48px; align-items: start; }
.form-shell > * { min-width: 0; }
.form-aside h2 { font-size: clamp(30px, 3.6vw, 42px); font-weight: 700; letter-spacing: -0.025em; margin-top: 12px; }
.form-aside p { color: var(--ink-2); margin-top: 14px; font-size: 17px; }
.benefits { list-style: none; padding: 0; margin: 24px 0 0; display: flex; flex-direction: column; gap: 12px; }
.benefits li { display: flex; gap: 12px; align-items: flex-start; font-size: 16px; color: var(--ink-2); }
.benefits svg { width: 20px; height: 20px; flex: none; margin-top: 2px; color: var(--accent); }
.form-card { padding: 32px; display: flex; flex-direction: column; gap: 20px; }
.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.field label, .field .lbl { font-weight: 600; font-size: 15px; }
.field .opt-l { font-weight: 400; color: var(--muted); font-size: 13.5px; margin-left: 4px; }
.input, .select { width: 100%; min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); font: inherit; font-size: 17px; transition: border-color .15s, box-shadow .15s; }
.select { appearance: none; -webkit-appearance: none; padding-right: 42px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 22px) 23px, calc(100% - 16px) 23px; background-size: 6px 6px; background-repeat: no-repeat; cursor: pointer; }
.input:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.input.bad, .select.bad { border-color: var(--crit); }
.err { font-size: 13.5px; color: var(--crit-ink); font-weight: 600; min-height: 0; }
.err:empty { display: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.row2 > * { min-width: 0; }
.phone { display: grid; grid-template-columns: minmax(150px, 210px) 1fr; gap: 10px; }
.phone > * { min-width: 0; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; color: var(--ink-2); cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 15px; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
.form-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
.privacy-note { font-size: 13px; color: var(--muted); }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode { text-align: left; padding: 18px; border-radius: var(--r-md); border: 1.5px solid var(--line-2); background: var(--surface); cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: border-color .15s, background .15s; }
.mode:hover { border-color: var(--ink-2); }
.mode[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.mode b { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.mode .mono { font-size: 12.5px; color: var(--muted); }
.mode span { font-size: 14.5px; color: var(--ink-2); line-height: 1.45; }
.mode[aria-pressed="true"] .mono { color: var(--accent-strong); }

/* ---------- cuestionario ---------- */
.qwrap { max-width: 880px; margin: 0 auto; }
.q-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.q-count { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.q-count b { color: var(--ink); font-weight: 600; }
.q-card { padding: 40px 44px 30px; }
.q-title { font-size: clamp(27px, 3.5vw, 40px); font-weight: 650; letter-spacing: -0.025em; line-height: 1.12; margin-top: 10px; }
.q-hint { color: var(--ink-2); font-size: 17px; margin-top: 10px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
.opts.one { grid-template-columns: 1fr; }
.opt { position: relative; display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 12px 18px 12px 14px; border-radius: var(--r-md); border: 1.5px solid var(--line-2); background: var(--surface); text-align: left; cursor: pointer; font-size: 18px; font-weight: 550; line-height: 1.3; transition: border-color .15s, background .15s, transform .12s, box-shadow .15s; }
.opt:hover { border-color: var(--ink-2); transform: translateY(-1px); box-shadow: var(--shadow); }
.opt .key { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 13px; font-weight: 600; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); transition: all .15s; }
.opt .lab { flex: 1; min-width: 0; }
.opt .tick { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; transition: all .15s; }
.opt.multi .tick { border-radius: 6px; }
.opt .tick svg { width: 14px; height: 14px; opacity: 0; color: var(--accent-ink); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .key { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); }
.opt[aria-pressed="true"] .tick svg { opacity: 1; }
.opt.pop { animation: pop .32s ease; }
@keyframes pop { 40% { transform: scale(1.02); } }
.q-why { display: flex; gap: 10px; align-items: flex-start; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 15px; }
.q-why svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--accent); }
.q-foot { display: flex; align-items: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.q-keys { font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.limit { font-size: 14px; font-weight: 600; color: var(--warn-ink); }

.intro { padding: 48px 48px 40px; display: grid; grid-template-columns: auto 1fr; gap: 36px; align-items: center; }
.intro-num { font-family: var(--f-display); font-size: clamp(90px, 12vw, 150px); font-weight: 700; line-height: .8; letter-spacing: -0.05em; color: var(--accent); }
.intro h2 { font-size: clamp(30px, 4vw, 46px); font-weight: 700; letter-spacing: -0.03em; margin-top: 10px; }
.intro p { color: var(--ink-2); font-size: 19px; margin-top: 12px; max-width: 32em; }
.intro .q-foot { margin-top: 28px; }

/* ---------- revisión de respuestas ---------- */
.review { padding: 28px 32px; }
.review h3 { font-size: 15px; font-family: var(--f-mono); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 6px; }
.review h3:first-of-type { margin-top: 0; }
.rv { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; width: 100%; padding: 12px 10px; margin: 0 -10px; border: 0; background: none; text-align: left; border-radius: 10px; cursor: pointer; border-bottom: 1px solid var(--line); }
.rv:hover { background: var(--surface-2); }
.rv .k { font-size: 14px; color: var(--muted); }
.rv .v { font-weight: 600; font-size: 16px; grid-column: 1; }

   Reglas transparentes: cada puntaje y cada brecha sale de respuestas concretas.
   Los montos usan el punto medio de cada rango (por eso se muestran con ≈). */
const MID = {
  q5: { i1: 7000, i2: 15000, i3: 27500, i4: 47500, i5: 80000, i6: 130000 },
  q6: { h1: 12000, h2: 22500, h3: 40000, h4: 65000, h5: 115000, h6: 180000 },
  q11: { g1: 6000, g2: 11500, g3: 20000, g4: 32500, g5: 50000 },
  q12: { s0: 0, s1: 0.03, s2: 0.075, s3: 0.155, s4: 0.25 },
  q13: { f0: 0, f1: 0.5, f2: 2, f3: 5, f4: 8 },
  q14: { d0: 0, d1: 0.05, d2: 0.15, d3: 0.28, d4: 0.45 },
  q17: { c0: 0.5, c1: 2, c2: 5, c3: 9.5, c4: 15 },
  q18: { a0: 400, a1: 750, a2: 1750, a3: 3750, a4: 6500 },
  q45: { l0: 400, l1: 1000, l2: 2250, l3: 5000, l4: 8500, none: 0 },
  q42: { r0: 48, r1: 53, r2: 58, r3: 63, r4: 67, nd: 65 },
  q43: { p40: 0.45, p51: 0.6, p71: 0.8, p90: 0.95, ns: 0.7 },
  q9: { n0: 0, n1: 1, n2: 2, n3: 3, n4: 4 },
  q24: { m0: 0, m1: 1, m2: 2, m3: 3 }
};
const SUPUESTOS = { rendimientoReal: 0.04, aniosRetiro: 20 };

const mid = (A, id) => (A[id] !== undefined && MID[id] && MID[id][A[id]] !== undefined) ? MID[id][A[id]] : undefined;
const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
const money = n => '$' + Math.round(n).toLocaleString('es-MX');
const moneyC = n => {
  const a = Math.abs(n);
  if (a >= 1e6) return '$' + (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.0', '') + ' M';
  if (a >= 1e4) return '$' + Math.round(n / 1000).toLocaleString('es-MX') + ' mil';
  return money(n);
};
const plural = (n, s, p) => n === 1 ? s : (p || s + 's');

function nivel(score) {
  if (score < 35) return { key: 'crit', label: 'Crítico' };
  if (score < 60) return { key: 'serious', label: 'Débil' };
  if (score < 80) return { key: 'warn', label: 'Aceptable' };
  return { key: 'good', label: 'Sólido' };
}
function prioridad(p) {
  if (p >= 75) return { key: 'crit', label: 'Urgente' };
  if (p >= 55) return { key: 'serious', label: 'Alta' };
  if (p >= 35) return { key: 'warn', label: 'Media' };
  return { key: 'good', label: 'Baja' };
}

function analyze(A, P) {
  const has = (id, k) => Array.isArray(A[id]) && A[id].includes(k);
  const age = Number(P.edad) || 35;
  const I = mid(A, 'q5');
  const G = mid(A, 'q11');
  const rate = mid(A, 'q12');
  const months = mid(A, 'q13');
  const debt = mid(A, 'q14');
  const dep = mid(A, 'q9') ?? 0;
  const kidsMinor = has('q3', 'hm');
  const jub = P.ocup === 'jub';
  const independiente = ['ind', 'empr', 'com'].includes(P.ocup);

  /* ---------- 1. Puntaje por área (0–100) ---------- */
  const areas = [];
  const gmm = has('q23', 'gmm'), col = has('q23', 'col'), pub = has('q23', 'imss') || has('q23', 'isss'), part = has('q23', 'part');

  { // Gastos médicos
    let s, drv;
    if (gmm) { s = pub ? 85 : 80; drv = 'Tienes seguro de gastos médicos privado.'; }
    else if (col) { s = 60; drv = 'Tu cobertura privada depende de tu empleo.'; }
    else if (pub) { s = 35; drv = 'Solo cuentas con seguridad social.'; }
    else if (part) { s = 15; drv = 'Pagas tu atención médica de tu bolsa.'; }
    else if (A.q23) { s = 0; drv = 'No tienes ninguna cobertura médica.'; }
    else { s = 40; drv = 'Sin información de cobertura.'; }
    s += ({ si: 15, par: 0, no: -10, ns: -5 })[A.q25] ?? 0;
    if (!gmm && (mid(A, 'q24') || 0) > 0) s -= 5;
    areas.push({ key: 'salud', name: 'Gastos médicos', score: clamp(s), drv,
      how: 'Parte del tipo de cobertura (privada 80, colectiva 60, seguridad social 35, consultas particulares 15, ninguna 0). Suma 15 si podrías pagar una emergencia sin deuda y resta 10 si no; resta 5 si otras personas necesitan cobertura y no tienes póliza privada.' });
  }

  let vidaNeed;
  { // Vida
    const debts = (debt || 0) > 0 || A.q8 === 'hip';
    vidaNeed = dep > 0 ? 'alta' : debts ? 'media' : 'baja';
    let s, drv;
    if (A.q27 === 'amb') { s = 85; drv = 'Tienes seguro de vida individual y laboral.'; }
    else if (A.q27 === 'ind') { s = 75; drv = 'Tienes seguro de vida individual.'; }
    else if (A.q27 === 'col') { s = 45; drv = 'Solo tienes el seguro de vida de tu trabajo.'; }
    else if (A.q27 === 'no') {
      s = { alta: 5, media: 30, baja: 60 }[vidaNeed];
      drv = vidaNeed === 'baja' ? 'No tienes seguro de vida, pero nadie depende de tu ingreso.' : 'No tienes seguro de vida y hay quien depende de ti o deudas por cubrir.';
    } else { s = 40; drv = 'Sin información de seguro de vida.'; }
    s += ({ con: 10, apx: 0, ns: -10 })[A.q28] ?? 0;
    s += ({ si: 15, par: 0, no: -10, ns: -5 })[A.q21] ?? 0;
    areas.push({ key: 'vida', name: 'Vida y familia', score: clamp(s), drv,
      how: 'Compara tu seguro de vida (individual 75, laboral 45, ambos 85) contra tu necesidad: sin seguro vale 5 si alguien depende de ti, 30 si solo tienes deudas y 60 si no hay ni dependientes ni deudas. Ajusta si conoces tu suma asegurada y si tu familia podría cubrir tus obligaciones.' });
  }

  { // Ingreso e incapacidad
    let s = ({ aho: 70, pen: 65, fam: 30, no: 5, ns: 15 })[A.q29] ?? 40;
    s += ({ si: 15, no: 0, ns: -5 })[A.q30] ?? 0;
    const c = mid(A, 'q17');
    if (c !== undefined) s += Math.min(c, 12);
    else if (months !== undefined) s += Math.min(months * 2, 12);
    if (['va', 'es'].includes(A.q7)) s -= 10;
    if (A.q7 === 'si') s -= 15;
    if (A.q16 === 'full') s += 5;
    const drv = A.q29 === 'no' ? 'No tendrías cómo cubrir tus gastos si no pudieras trabajar.'
      : A.q29 === 'fam' ? 'Dependerías de tu familia si no pudieras trabajar.'
      : A.q29 === 'aho' || A.q29 === 'pen' ? 'Tienes un respaldo si no pudieras trabajar.' : 'No está claro cómo cubrirías tus gastos sin poder trabajar.';
    areas.push({ key: 'ingreso', name: 'Ingreso e incapacidad', score: clamp(s), drv,
      how: 'Parte de cómo cubrirías tus gastos sin poder trabajar (ahorros 70, pensión o seguro 65, familia 30, nada 5). Suma 15 si tienes seguro de accidentes y hasta 12 por los meses que aguantarías sin ingreso. Resta 10 si tus ingresos son variables.' });
  }

  if (months !== undefined || rate !== undefined || debt !== undefined) { // Finanzas personales
    const f = Math.min((months ?? 1) / 6, 1) * 45;
    const sv = Math.min((rate ?? 0.05) / 0.2, 1) * 30;
    const d = (1 - Math.min((debt ?? 0.1) / 0.4, 1)) * 25;
    const s = f + sv + d;
    const drv = (months ?? 0) < 1 ? 'Tu fondo de emergencia no alcanza ni para un mes.'
      : (months ?? 0) < 3 ? 'Tu fondo de emergencia está por debajo de 3 meses.' : 'Tienes un fondo de emergencia razonable.';
    areas.push({ key: 'liquidez', name: 'Finanzas personales', score: clamp(s), drv,
      how: 'Suma tres partes: fondo de emergencia (45 puntos al llegar a 6 meses de gastos), tasa de ahorro (30 puntos al llegar a 20%) y carga de deuda (25 puntos sin deudas, 0 al llegar a 40% del ingreso).' });
  }

  { // Retiro
    let s = ({ ppr: 70, inv: 60, ban: 35, no: 5 })[A.q44] ?? 30;
    s += ({ rev: 15, norev: 5, ns: -5, na: 0 })[A.q41] ?? 0;
    if (A.q45 === 'none') s -= 5;
    if (age < 30 && !jub) s += 10;
    const drv = A.q44 === 'no' ? 'Tu retiro depende solo de tu AFORE.' : A.q44 ? 'Ya ahorras para tu retiro fuera de la AFORE.' : 'Sin información de ahorro para el retiro.';
    areas.push({ key: 'retiro', name: 'Retiro', score: clamp(s), drv,
      how: 'Parte de tu ahorro voluntario para el retiro (PPR 70, inversiones 60, banco 35, nada 5). Suma 15 si revisas tu AFORE y 10 si tienes menos de 30 años (el tiempo juega a tu favor). Resta 5 si hoy no tienes capacidad de aportar.' });
  }

  if (tieneCasa(A) && A.q34) {
    let s = ({ si: 85, no: 10, ns: 25 })[A.q34];
    if (A.q34 === 'si' && has('q36', 'ne')) s -= 10;
    areas.push({ key: 'hogar', name: 'Hogar', score: clamp(s), drv: A.q34 === 'si' ? 'Tu vivienda tiene seguro.' : A.q34 === 'no' ? 'Tu vivienda o tus pertenencias no tienen seguro.' : 'No sabes si tu vivienda tiene seguro.',
      how: 'Con seguro vigente vale 85, si no sabes 25 y sin seguro 10. Resta 10 si nunca evaluaste qué riesgos cubre.' });
  }
  if (A.q38) {
    const s = ({ amp: 90, lim: 60, rc: 35, sin: 0 })[A.q38];
    areas.push({ key: 'auto', name: 'Auto', score: s, drv: ({ amp: 'Tu vehículo tiene cobertura amplia.', lim: 'Tu cobertura limitada no paga los daños a tu propio vehículo.', rc: 'Solo tienes responsabilidad civil.', sin: 'Tu vehículo no tiene seguro.' })[A.q38],
      how: 'Cobertura amplia 90, limitada 60, solo responsabilidad civil 35, sin seguro 0.' });
  }
  if (A.q40) {
    const s = ({ si: 85, par: 45, no: 10, ns: 20 })[A.q40];
    areas.push({ key: 'negocio', name: 'Negocio', score: s, drv: ({ si: 'Tu negocio está protegido.', par: 'Tu negocio está protegido solo en parte.', no: 'Tu negocio no tiene protección.', ns: 'No sabes si tu negocio está protegido.' })[A.q40],
      how: 'Protección completa 85, parcial 45, no sabe 20, sin protección 10.' });
  }
  areas.forEach(a => a.level = nivel(a.score));
  const AREA = Object.fromEntries(areas.map(a => [a.key, a]));

  /* ---------- 2. Prioridad por producto ---------- */
  const products = [];
  const pref = (cond, pts, text, list) => { if (cond) { list.push(text); return pts; } return 0; };
  const p51 = k => has('q51', k);

  { // GMM
    const r = []; let b = 0;
    if (!gmm && !col) r.push(pub ? 'Solo tienes seguridad social: sin acceso a hospitales privados.' : 'No tienes ningún seguro médico.');
    else if (!gmm && col) r.push('Tu seguro médico actual se termina si dejas tu empleo.');
    if (A.q25 === 'no') r.push('Una emergencia médica privada te obligaría a endeudarte.');
    if (A.q25 === 'par') r.push('Solo podrías pagar una parte de una emergencia médica.');
    const extra = mid(A, 'q24') || 0;
    if (extra > 0) r.push(`${extra === 3 ? '3 o más' : extra} ${plural(extra, 'persona')} más ${extra === 1 ? 'necesita' : 'necesitan'} cobertura médica.`);
    b += pref(A.q26 === 'ind', 10, 'Para ti es indispensable atenderte en hospital privado.', r);
    b += pref(A.q26 === 'des', 5, 'Prefieres atenderte en hospital privado.', r);
    b += pref(A.q22 === 'med', 10, 'Una emergencia médica es lo que más te preocupa.', r);
    b += pref(p51('sal'), 12, 'Elegiste la salud entre tus prioridades.', r);
    b += pref(A.q10 === 'sal', 8, 'Tu objetivo principal es proteger tu salud.', r);
    b += pref(['enf', 'hos', 'tod'].includes(A.q32), 6, 'Quieres cubrir primero enfermedad u hospitalización.', r);
    products.push({ key: 'gmm', pri: (100 - AREA.salud.score) + b, reasons: r });
  }
  { // Vida
    const r = []; let b = 0;
    const w = { alta: 1, media: 0.75, baja: 0.45 }[vidaNeed];
    if (dep > 0) r.push(`${dep === 4 ? '4 o más personas dependen' : dep + ' ' + plural(dep, 'persona') + (dep === 1 ? ' depende' : ' dependen')} de tu ingreso.`);
    if (A.q27 === 'no') r.push('No tienes seguro de vida.');
    if (A.q27 === 'col') r.push('Tu seguro de vida es solo el de tu trabajo y termina si te cambias.');
    if (A.q28 === 'ns') r.push('No sabes cuánto recibirían tus beneficiarios.');
    if (['no', 'par'].includes(A.q21)) r.push('Tu familia no podría cubrir tus obligaciones si faltaras.');
    if (A.q8 === 'hip' || A.q15 === 'hip') r.push('Tienes una hipoteca en curso.');
    b += pref(A.q22 === 'fal', 10, 'Te preocupa fallecer y dejar deudas.', r);
    b += pref(p51('vid'), 12, 'Elegiste la vida entre tus prioridades.', r);
    b += pref(A.q10 === 'fam', 8, 'Tu objetivo principal es proteger a tu familia.', r);
    b += pref(A.q32 === 'fal', 6, 'Quieres cubrir primero el fallecimiento.', r);
    products.push({ key: 'vida', pri: (100 - AREA.vida.score) * w + b, reasons: r });
  }
  { // Invalidez / accidentes
    const r = []; let b = 0;
    if (A.q29 === 'no') r.push('Si no pudieras trabajar, no tendrías cómo cubrir tus gastos.');
    if (A.q29 === 'fam') r.push('Si no pudieras trabajar, dependerías de tu familia.');
    if (A.q30 === 'no') r.push('No tienes seguro de accidentes personales.');
    if (['va', 'es'].includes(A.q7)) r.push('Tus ingresos son variables.');
    if (independiente) r.push('Trabajas por tu cuenta: nadie más paga tu ingreso mientras te recuperas.');
    b += pref(A.q22 === 'ing', 10, 'Perder tus ingresos es lo que más te preocupa.', r);
    b += pref(p51('inv'), 12, 'Elegiste la invalidez entre tus prioridades.', r);
    b += pref(['inv', 'acc'].includes(A.q32), 6, 'Quieres cubrir primero invalidez o accidentes.', r);
    products.push({ key: 'inv', pri: (100 - AREA.ingreso.score) * 0.85 + b, reasons: r });
  }
  { // PPR
    const r = []; let b = 0;
    const w = jub ? 0.3 : A.q45 === 'none' ? 0.5 : 0.8;
    if (A.q44 === 'no') r.push('No ahorras para tu retiro fuera de la AFORE.');
    if (['norev', 'ns'].includes(A.q41)) r.push('No conoces el saldo de tu AFORE.');
    const ret = mid(A, 'q42') ?? 65;
    if (!jub && ret > age) r.push(`Te quedan ≈${Math.max(ret - age, 1)} años para la edad en que quieres retirarte.`);
    b += pref(['si', 'req'].includes(A.q48), 6, 'Te interesa deducir impuestos con tu ahorro para el retiro.', r);
    b += pref(A.q22 === 'ret', 10, 'No tener retiro suficiente es lo que más te preocupa.', r);
    b += pref(p51('ret'), 12, 'Elegiste el retiro entre tus prioridades.', r);
    b += pref(A.q10 === 'ret', 8, 'Tu objetivo principal es ahorrar para el retiro.', r);
    if (age >= 25 && age <= 55 && !jub) b += 5;
    products.push({ key: 'ppr', pri: (100 - AREA.retiro.score) * w + b, reasons: r });
  }
  if (kidsMinor || ['e5', 'e10', 'e11'].includes(A.q49)) { // Educativo
    const r = []; let b = 0;
    const base = ({ e5: 70, e10: 60, e11: 45, na: 10 })[A.q49] ?? 50;
    if (kidsMinor) r.push('Tienes hijos menores de edad.');
    if (A.q49 === 'e5') r.push('Vas a necesitar el dinero de su educación en menos de 5 años.');
    if (A.q49 === 'e10') r.push('Vas a necesitar el dinero de su educación en 6 a 10 años.');
    b += pref(A.q20 === 'edu', 8, 'La educación de tus hijos es tu meta con fecha.', r);
    b += pref(p51('edu'), 12, 'Elegiste la educación entre tus prioridades.', r);
    products.push({ key: 'edu', pri: base + b, reasons: r });
  }
  if (AREA.hogar) {
    const r = []; let b = 0;
    if (A.q34 === 'no') r.push(A.q8 === 'ren' ? 'Tus pertenencias no tienen seguro.' : 'Tu vivienda no tiene seguro.');
    if (A.q34 === 'ns') r.push('No sabes si tu vivienda está asegurada ni qué cubre.');
    if (['v3', 'v4'].includes(A.q35)) r.push('Tus pertenencias valen más de $300,000.');
    if (has('q36', 'ne')) r.push('Nunca has evaluado qué riesgos tiene tu vivienda.');
    b += pref(p51('hog'), 12, 'Elegiste el hogar entre tus prioridades.', r);
    b += pref(A.q22 === 'pat', 10, 'Perder tu patrimonio es lo que más te preocupa.', r);
    products.push({ key: 'hogar', pri: (100 - AREA.hogar.score) * 0.75 + b, reasons: r });
  }
  if (AREA.auto) {
    const r = []; let b = A.q38 === 'sin' ? 10 : 0;
    r.push(AREA.auto.drv);
    if (A.q38 === 'rc') r.push('Si te roban el vehículo o lo chocas, la pérdida es tuya.');
    b += pref(p51('aut'), 12, 'Elegiste el automóvil entre tus prioridades.', r);
    products.push({ key: 'auto', pri: (100 - AREA.auto.score) * 0.8 + b, reasons: r });
  }
  if (AREA.negocio) {
    const r = [AREA.negocio.drv]; let b = 0;
    b += pref(p51('neg'), 12, 'Elegiste tu negocio entre tus prioridades.', r);
    b += pref(A.q10 === 'neg', 8, 'Tu objetivo principal es proteger tu negocio.', r);
    b += pref(A.q22 === 'pat', 5, 'Perder tu patrimonio es lo que más te preocupa.', r);
    products.push({ key: 'neg', pri: (100 - AREA.negocio.score) * 0.85 + b, reasons: r });
  }
  products.forEach(p => { p.raw = p.pri; p.pri = clamp(p.pri); p.level = prioridad(p.pri); Object.assign(p, PRODUCTOS[p.key]); });
  products.sort((a, b) => b.raw - a.raw);

  // Distribución orientativa del presupuesto declarado
  const cap = mid(A, 'q18');
  let budget = null;
  if (cap) {
    const top = products.filter(p => p.pri >= 35).slice(0, 3);
    const tot = top.reduce((s, p) => s + p.pri, 0);
    if (top.length && tot) budget = { cap, items: top.map(p => ({ key: p.key, short: p.short, amt: Math.round(cap * p.pri / tot / 50) * 50 })) };
  }

  /* ---------- 3. Métricas ---------- */
  const lifeYears = dep === 0 ? 2 : Math.min(5 + dep, 10);
  const metrics = {
    I, G, rate, months, debt,
    lifeYears, lifeNeed: I ? I * 12 * lifeYears : undefined,
    fundTarget: G ? [G * 3, G * 6] : undefined
  };

  /* ---------- 4. Proyección de retiro ---------- */
  let retire = null;
  if (!jub && I) {
    let retAge = mid(A, 'q42') ?? 65;
    retAge = Math.max(retAge, age + 5);
    const n = retAge - age;
    let c = mid(A, 'q45'), cSrc = 'q45';
    if (!c) { const cap2 = mid(A, 'q18'); c = cap2 ? Math.round(cap2 * 0.4 / 50) * 50 : 1000; cSrc = cap2 ? 'q18' : 'demo'; }
    const ratio = mid(A, 'q43') ?? 0.7;
    const rm = Math.pow(1 + SUPUESTOS.rendimientoReal, 1 / 12) - 1;
    const fv = (pm, yrs) => pm * (Math.pow(1 + rm, 12 * yrs) - 1) / rm;
    const W = I * ratio;
    const target = W * (1 - Math.pow(1 + rm, -12 * SUPUESTOS.aniosRetiro)) / rm;
    const pts = [];
    for (let y = 0; y <= n; y++) pts.push({ age: age + y, a: fv(c, y), b: fv(c * 2, y) });
    const need = target / ((Math.pow(1 + rm, 12 * n) - 1) / rm);
    retire = { age, retAge, n, c, cSrc, ratio, W, target, pts, final: fv(c, n), final2: fv(c * 2, n), need, pct: Math.min(fv(c, n) / target, 9.99) };
  }

  /* ---------- 5. Brechas (lo que el cliente no ve) ---------- */
  const gaps = [];
  const gap = (sev, area, title, detail) => gaps.push({ sev, area, title, detail });
  if (months !== undefined && months < 1) {
    gap('crit', 'Finanzas personales', 'Tu colchón de emergencia no llega a un mes',
      `Si mañana se detiene tu ingreso, tus ahorros disponibles durarían ${months === 0 ? 'cero días' : 'unas 2 semanas'}. Lo sano es tener de 3 a 6 meses de gastos${G ? `: entre ${moneyC(G * 3)} y ${moneyC(G * 6)} en tu caso` : ''}.`);
  } else if (months !== undefined && months < 3) {
    gap('serious', 'Finanzas personales', 'Tu fondo de emergencia está por debajo de lo recomendado',
      `Cubre entre 1 y 3 meses de gastos. La referencia es de 3 a 6 meses${G ? ` (${moneyC(G * 3)} – ${moneyC(G * 6)})` : ''}.`);
  }
  if (A.q12 === 's0') gap('serious', 'Finanzas personales', 'Hoy no estás ahorrando', 'Sin ahorro constante, cualquier imprevisto termina en deuda. Un primer objetivo realista es apartar entre 5% y 10% de tu ingreso.');
  else if (A.q12 === 's1') gap('warn', 'Finanzas personales', 'Ahorras menos del 5% de tu ingreso', `A este ritmo, juntar 3 meses de gastos te tomaría años.${I ? ` Llegar al 10% sería apartar ≈${money(I * 0.1)} al mes.` : ''}`);
  if (debt !== undefined && debt >= 0.45) gap('crit', 'Finanzas personales', 'Más de un tercio de tu ingreso se va en deudas', 'Con este nivel de deuda, una incapacidad o una emergencia te dejaría sin margen para pagar. Esas deudas no desaparecen si tú faltas.');
  else if (debt !== undefined && debt >= 0.28) gap('serious', 'Finanzas personales', 'Una parte importante de tu ingreso se va en deudas', `Entre 21% y 35% de lo que ganas${I ? ` (≈${money(I * debt)} al mes)` : ''} ya está comprometido.`);

  if (!gmm && !col) {
    const sev = ['no', 'ns', undefined].includes(A.q25) ? 'crit' : 'serious';
    gap(sev, 'Gastos médicos', pub ? 'Una hospitalización privada saldría de tu bolsa' : 'No tienes protección ante gastos médicos',
      (pub ? 'El IMSS o el ISSSTE te dan atención, pero no acceso a hospitales privados ni elección de médico ni de tiempos. ' : 'Hoy cualquier atención médica sale de tu bolsa. ') +
      (A.q25 === 'no' ? 'Además, indicaste que no podrías pagar una emergencia sin endeudarte.' : A.q25 === 'par' ? 'Indicaste que solo podrías pagar una parte de una emergencia.' : 'Una cirugía o una hospitalización de varios días puede costar más que varios meses de ingreso.'));
  } else if (!gmm && col) {

function showTip(html, x, y) {

let advanceT = null;
BIND.quiz = () => {
  bindTop();
  $('#b-back').onclick = back;
  $('#b-next').onclick = next;
  const res = $('#b-res'); if (res) res.onclick = () => go('results');
  const cur = flow().find(s => s.k === S.pos);
  if (!cur || cur.type !== 'q') return;
  const q = cur.q;
  $('#b-skip').onclick = () => { S.answers[q.id] = '__skip'; next(); };
  $$('.opt').forEach(btn => btn.onclick = () => {
    const k = btn.dataset.k;
    if (!q.multi) {
      S.answers[q.id] = k;
      $$('.opt').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
      $('#b-next').disabled = false; save();
      clearTimeout(advanceT);
      const pos = S.pos;
      advanceT = setTimeout(() => { if (S.screen === 'quiz' && S.pos === pos) next(); }, reduced ? 120 : 420);
      return;
    }
    let arr = Array.isArray(S.answers[q.id]) ? S.answers[q.id].slice() : [];
    const lim = $('#limit'); lim.hidden = true;
    if (arr.includes(k)) arr = arr.filter(x => x !== k);
    else {
      if (q.exclusive && q.exclusive.includes(k)) arr = [k];
      else {
        arr = arr.filter(x => !(q.exclusive || []).includes(x));
        if (q.max && arr.length >= q.max) { lim.hidden = false; return; }
        arr.push(k);
      }
    }
    S.answers[q.id] = arr;
    $$('.opt').forEach(b => b.setAttribute('aria-pressed', String(arr.includes(b.dataset.k))));
    $('#b-next').disabled = !arr.length; save();

  if (e.key === 'Enter') { e.preventDefault(); const n = $('#b-next'); if (n && !n.disabled) next(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); back(); return; }
  if (cur.type === 'q' && /^[1-9]$/.test(e.key)) { const b = $$('.opt')[+e.key - 1]; if (b) b.click(); }

function areaBars(areas, interactive, compact) {
  const ticks = [35, 60, 80].map(t => `<span class="tick" style="left:${t}%"></span>`).join('');
  const rows = areas.map((a, i) => {
    const tip = `<b>${a.score}/100</b> · ${esc(a.level.label)}<br>${esc(a.drv)}`;
    const inner = `<span class="bar-name">${esc(a.name)}</span><span class="bar-track">${ticks}<span class="bar-fill ${a.level.key}" style="width:${Math.max(a.score, 1.5)}%;animation-delay:${i * 70}ms"></span></span><span class="bar-val"><b>${a.score}</b>${compact ? '' : chip(a.level.key, a.level.label)}</span>`;
    return interactive
      ? `<button class="bar-row" aria-expanded="false" data-tip="${esc(tip)}" data-i="${i}">${inner}</button><div class="bar-how" id="how-${i}" hidden><b>${esc(a.drv)}</b> ${esc(a.how)}</div>`
      : `<div class="bar-row" data-tip="${esc(tip)}">${inner}</div>`;
  }).join('');
  const axis = `<div class="scale${compact ? ' compact' : ''}" aria-hidden="true"><span></span><div class="scale-axis"><span style="left:0">0</span><span style="left:35%">35</span><span style="left:60%">60</span><span style="left:80%">80</span><span style="left:100%">100</span></div><span></span></div>`;
  return `<div class="bars${compact ? ' compact' : ''}">${rows}</div>${axis}`;
}

const RANGE = { q13: { f0: '0', f1: '< 1', f2: '1–3', f3: '4–6', f4: '6+' }, q12: { s0: '0%', s1: '< 5%', s2: '5–10%', s3: '11–20%', s4: '> 20%' }, q14: { d0: '0%', d1: '< 10%', d2: '10–20%', d3: '21–35%', d4: '> 35%' } };

function retireChart(rt) {
  const W = 640, H = 300, L = 70, R = 92, T = 26, B = 40, pw = W - L - R, ph = H - T - B;
  const maxV = Math.max(rt.target, rt.final2) * 1.08;
  const stepRaw = maxV / 4, mag = Math.pow(10, Math.floor(Math.log10(stepRaw))), nm = stepRaw / mag;
  const step = (nm <= 1 ? 1 : nm <= 2 ? 2 : nm <= 2.5 ? 2.5 : nm <= 5 ? 5 : 10) * mag;
  const top = Math.ceil(maxV / step) * step;
  const x = a => L + (a - rt.age) / Math.max(rt.n, 1) * pw, y = v => T + ph - v / top * ph;
  let grid = '';
  for (let v = 0; v <= top + 1; v += step) grid += `<line x1="${L}" x2="${L + pw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 10}" y="${y(v) + 4}" text-anchor="end" font-size="11.5" fill="var(--muted)">${moneyC(v)}</text>`;
  const xs = []; const st = rt.n > 24 ? 5 : rt.n > 10 ? 2 : 1;
  for (let a = rt.age; a <= rt.retAge; a += st) xs.push(a);
  if (xs[xs.length - 1] !== rt.retAge) { if (rt.retAge - xs[xs.length - 1] < st * 0.6) xs.pop(); xs.push(rt.retAge); }
  const xt = xs.map(a => `<text x="${x(a)}" y="${T + ph + 22}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${a}</text>`).join('');
  const line = k => rt.pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.age).toFixed(1)} ${y(p[k]).toFixed(1)}`).join(' ');
  const area = `${line('a')} L${x(rt.retAge)} ${y(0)} L${x(rt.age)} ${y(0)} Z`;
  const lastP = rt.pts[rt.pts.length - 1];
  let ya = y(lastP.a), yb = y(lastP.b);
  if (Math.abs(ya - yb) < 16) { const m = (ya + yb) / 2; yb = m - 9; ya = m + 9; }
  const yT = y(rt.target);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyección de ahorro para el retiro" id="rchart">
    ${grid}
    <line x1="${L}" x2="${L + pw}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/>
    ${xt}
    <text x="${L + pw / 2}" y="${H - 4}" text-anchor="middle" font-size="11" fill="var(--muted)">Edad</text>
    <path d="${area}" fill="var(--s1)" opacity=".12"/>
    <line x1="${L}" x2="${L + pw}" y1="${yT}" y2="${yT}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="${L + 8}" y="${yT - 8}" font-size="12" font-weight="600" fill="var(--ink)">Meta ≈ ${moneyC(rt.target)}</text>
    <path d="${line('b')}" fill="none" stroke="var(--s2)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${line('a')}" fill="none" stroke="var(--s1)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(lastP.age)}" cy="${y(lastP.b)}" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
    <circle cx="${x(lastP.age)}" cy="${y(lastP.a)}" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${x(lastP.age) + 10}" y="${yb + 4}" font-size="12" font-weight="600" fill="var(--ink)">${moneyC(lastP.b)}</text>
    <text x="${x(lastP.age) + 10}" y="${ya + 4}" font-size="12" font-weight="600" fill="var(--ink)">${moneyC(lastP.a)}</text>
    <g id="rc-hover" style="display:none"><line id="rc-x" y1="${T}" y2="${T + ph}" stroke="var(--ink-2)" stroke-width="1"/><circle id="rc-b" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><circle id="rc-a" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/></g>
    <rect id="rc-hit" x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent"/>
  </svg>`;
}
function bindRetire(rt) {
  const svg = $('#rchart'); if (!svg) return;
  const W = 640, L = 70, R = 92, T = 26, B = 40, pw = W - L - R, H = 300, ph = H - T - B;
  const maxV = Math.max(rt.target, rt.final2) * 1.08;
  const stepRaw = maxV / 4, mag = Math.pow(10, Math.floor(Math.log10(stepRaw))), nm = stepRaw / mag;
  const step = (nm <= 1 ? 1 : nm <= 2 ? 2 : nm <= 2.5 ? 2.5 : nm <= 5 ? 5 : 10) * mag, top = Math.ceil(maxV / step) * step;
  const y = v => T + ph - v / top * ph;
  const hit = $('#rc-hit'), g = $('#rc-hover');
  hit.addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(rt.n, Math.round((sx - L) / pw * rt.n))), p = rt.pts[i], px = L + i / Math.max(rt.n, 1) * pw;
    g.style.display = '';
    $('#rc-x').setAttribute('x1', px); $('#rc-x').setAttribute('x2', px);
    $('#rc-a').setAttribute('cx', px); $('#rc-a').setAttribute('cy', y(p.a));
    $('#rc-b').setAttribute('cx', px); $('#rc-b').setAttribute('cy', y(p.b));
    showTip(`A los <b>${p.age}</b> años<br>Aportando ${money(rt.c)}/mes: <b>${money(p.a)}</b><br>Aportando ${money(rt.c * 2)}/mes: <b>${money(p.b)}</b><br>Meta: <b>${money(rt.target)}</b>`, e.clientX, e.clientY);
  });
  hit.addEventListener('mouseleave', () => { g.style.display = 'none'; hideTip(); });
}

      <div class="agent-body"><div class="kv">${kvRows(R.agent.rows.slice(0, half))}</div><div class="kv">${kvRows(R.agent.rows.slice(half))}</div></div>
    </details>

    <p class="disclaimer">Este diagnóstico es orientativo: se basa en las respuestas proporcionadas y en reglas de cálculo explícitas, con montos aproximados al punto medio de cada rango. No es una cotización ni asesoría legal, fiscal o actuarial. La elegibilidad, coberturas, primas y aceptación dependen de cada aseguradora y de las condiciones de cada contrato. Los beneficios fiscales de productos de retiro deben verificarse según tu régimen y los límites vigentes.</p>
  </main>`;
};
BIND.results = () => {
  bindTop();
  const A = activeAnswers(), R = analyze(A, S.profile);
  const e = $('#b-edit'); if (e) e.onclick = () => go('review');
  $('#b-copy').onclick = () => copySummary(R);
  $$('button.bar-row').forEach(b => b.onclick = () => {
    const open = b.getAttribute('aria-expanded') === 'true';
    b.setAttribute('aria-expanded', String(!open));
    $('#how-' + b.dataset.i).hidden = open;
  });
  if (R.retire) bindRetire(R.retire);
};

function summaryText(R) {
  const P = S.profile, L = [];
  L.push(`DIAGNÓSTICO 360 · ${P.nombre || 'Cliente'} (${P.edad} años)`);
  L.push(`Folio ${S.folio} · ${new Date(S.ended || Date.now()).toLocaleDateString('es-MX')}${P.asesor ? ' · Asesor: ' + P.asesor : ''}`);
  if (S.reg) L.push(`Contacto: ${S.reg.email} · ${S.reg.lada} ${S.reg.tel}`);
  L.push('', 'PRIORIDAD #1: ' + R.products[0].name + ` (${R.products[0].pri}/100)`);
  R.products[0].reasons.slice(0, 4).forEach(r => L.push('  - ' + r));
  L.push('', 'NIVEL POR ÁREA');
  R.areas.forEach(a => L.push(`  ${a.name}: ${a.score}/100 (${a.level.label})`));
  L.push('', 'PUNTOS VULNERABLES');
  R.gaps.forEach(g => L.push(`  [${SEVLABEL[g.sev]}] ${g.title}`));
  if (R.ok.length) { L.push('', 'YA CUBIERTO'); R.ok.forEach(o => L.push('  - ' + o.title)); }
  const oth = R.products.slice(1, 4).filter(p => p.pri >= 20);
  if (oth.length) { L.push('', 'TAMBIÉN REVISAR'); oth.forEach(p => L.push(`  - ${p.name} (prioridad ${p.level.label.toLowerCase()})`)); }
  if (R.checks.length) { L.push('', 'POR VALIDAR'); R.checks.forEach(c => L.push('  - ' + c)); }
  L.push('', 'NOTAS DEL ASESOR');
  R.agent.rows.forEach(r => { if (r[1] !== '—') L.push(`  ${r[0]}: ${r[1]}`); });
  return L.join('\n');
}
function copySummary(R) {
  const txt = summaryText(R);
  const fallback = () => modal(`<h3>Resumen del diagnóstico</h3><p>Selecciona el texto y cópialo para pegarlo en tu CRM, correo o WhatsApp.</p><textarea id="m-txt" readonly>${esc(txt)}</textarea><div class="modal-foot"><button class="btn btn-primary" data-close>Listo</button></div>`,
    m => { const t = $('#m-txt', m); t.focus(); t.select(); });
  try {
    navigator.clipboard.writeText(txt).then(() => toast('Resumen copiado'), fallback);
  } catch (err) { fallback(); }
}

render();
</script>
